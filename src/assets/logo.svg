<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="100" cy="100" r="66" fill="url(#glowGradient)" filter="url(#glow)" />

  <!-- Globe outline -->
  <circle cx="100" cy="100" r="60" fill="#3b82f6" fillOpacity="0.1" stroke="#3b82f6" strokeWidth="2"/>

  <!-- Meridians -->
  <path d="M100 40C90 50 90 150 100 160" stroke="#3b82f6" strokeOpacity="0.6" strokeWidth="1.5" strokeLinecap="round"/>
  <path d="M100 40C110 50 110 150 100 160" stroke="#3b82f6" strokeOpacity="0.6" strokeWidth="1.5" strokeLinecap="round"/>

  <!-- Parallels -->
  <path d="M40 90C50 85 150 85 160 90" stroke="#3b82f6" strokeOpacity="0.6" strokeWidth="1.5" strokeLinecap="round"/>
  <path d="M40 110C50 115 150 115 160 110" stroke="#3b82f6" strokeOpacity="0.6" strokeWidth="1.5" strokeLinecap="round"/>

  <!-- Flow lines (dynamic) -->
  <path d="M20 70C50 50 80 50 120 40" stroke="#3b82f6" strokeWidth="2" strokeLinecap="round"/>
  <path d="M80 160C110 150 140 140 180 120" stroke="#3b82f6" strokeWidth="2" strokeLinecap="round"/>

  <!-- Text: Pulse (gold) + FX (light) -->
  <text x="100" y="180" fontFamily="system-ui, -apple-system, sans-serif" fontSize="28" fontWeight="700" textAnchor="middle" fill="#d4af37">Pulse</text>
  <text x="160" y="180" fontFamily="system-ui, -apple-system, sans-serif" fontSize="28" fontWeight="700" textAnchor="middle" fill="#e5e7eb">FX</text>

  <!-- Subtitle -->
  <text x="100" y="200" fontFamily="system-ui, -apple-system, sans-serif" fontSize="10" textAnchor="middle" fill="#9ca3af" letterSpacing="2">CÂMBIO INTELIGENTE</text>
</svg>
